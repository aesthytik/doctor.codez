name: CI

# Checks every pull request and every push to main: the dataset must validate,
# and the site must lint, type-check and build.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate the dataset
        run: pnpm validate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
